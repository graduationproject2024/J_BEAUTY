  <style>
    @keyframes jbSkeletonShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .jb-skeleton-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px 60px;
      direction: rtl;
    }
    .jb-skel-el {
      background: linear-gradient(90deg, #F5EFEB 25%, #EBE2D9 50%, #F5EFEB 75%);
      background-size: 200% 100%;
      animation: jbSkeletonShimmer 1.8s ease-in-out infinite;
      border-radius: 12px;
    }
    .jb-skel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 24px;
      border-bottom: 1px solid rgba(212,175,124,0.15);
      margin-bottom: 32px;
    }
    .jb-skel-hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 0 40px;
    }
    .jb-skel-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .jb-skel-card {
      border: 1px solid rgba(212,175,124,0.2);
      border-radius: 18px;
      padding: 20px;
      background: rgba(255,255,255,0.7);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
